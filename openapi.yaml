openapi: 3.1.0

info:
  title: GABAI API
  version: 0.1.0
  description: |
    Citizen service request classification and routing for a barangay LGU.

    Residents submit free-text requests; a classifier assigns a category and an
    urgency level, each with its own confidence score. A request is auto-routed
    only when `min(category_confidence, urgency_confidence)` meets the configured
    threshold (0.70) and, when the predicted urgency is low, the urgency
    confidence also meets `LOW_URGENCY_MIN_CONFIDENCE` (0.85); otherwise it
    enters the manual review queue for a human to label.

    **Conventions**

    - JSON bodies use `snake_case`.
    - Timestamps are ISO-8601 with a UTC offset (`2026-08-30T04:15:00Z`).
    - List endpoints use offset pagination and return a `PaginatedResponse`.
    - Errors use a single envelope; see `Error`.
    - Authorization is enforced server-side on every endpoint. A client hiding a
      control is not access control.
    - Categories are **data, not an enum**. Never hardcode them; read
      `GET /api/categories`.

servers:
  - url: http://localhost:8000
    description: Local development
  - url: /
    description: Same origin as the deployed frontend

tags:
  - name: auth
    description: Registration, session login, current user
  - name: requests
    description: Submission, listing, detail, status changes, attachments
  - name: review
    description: Manual review queue for low-confidence classifications
  - name: categories
  - name: notifications
  - name: registrations
    description: Staff approving residents who signed up
  - name: admin
    description: Account management, routing configuration, audit log
  - name: site
    description: The barangay's details and the site's look, shown before sign-in
  - name: locations
    description: Puroks and streets residents can pick for where a problem is

security:
  - cookieAuth: []

paths:
  # ---------------------------------------------------------------- auth ----
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a citizen account
      description: |
        Self-registration always creates a `citizen`. Staff and admin accounts are
        created by an admin via `POST /api/admin/users`; a `role` sent here is
        ignored rather than honoured, so this endpoint cannot be used to escalate.

        The account starts with `approval_status: pending`. It can sign in, but
        until staff approve it through `PATCH /api/registrations/{user_id}`,
        every route except `/api/auth/me`, password change and logout answers
        403. Only someone holding the password learns the account is pending.

        `terms_version` is the version of the Terms of Use and Privacy Notice the
        person was shown, and must equal `terms_version` from `GET /api/site`. An older version answers 409, so a page loaded before
        the notice changed can't sign someone up to text they never saw.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created. Does not log the user in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: |
            The email is taken, or `terms_version` is not the current one (detail
            code `TERMS_OUTDATED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Start a session
      description: |
        Sets an HttpOnly, Secure, SameSite=Lax session cookie. No token is
        returned in the body, and nothing is stored in `localStorage`. A token
        readable by JavaScript is XSS-exposed.

        The body is form-encoded, not JSON, and the email goes in the `username`
        field, the `fastapi-users` convention.

        Failed attempts are limited: 5 within 15 minutes for one account, or 30
        from one address, and sign-in is refused with 429 until the window
        passes, even with the right password. Each sign-in, failure and lockout
        is written to the audit log (`user.signed_in`, `user.sign_in_failed`,
        `user.sign_in_locked`); the typed email is never stored.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session established; cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
              example: gabai_session=...; HttpOnly; Secure; SameSite=Lax; Path=/
        "400":
          description: Bad credentials, or the account is deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; wait and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the session
      responses:
        "204":
          description: Session cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user
      description: |
        Works while `must_change_password` is set, so the client can tell the
        person to change it. Everything else except `PUT /api/auth/password` and
        logout answers 403 until they do.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/terms:
    post:
      tags: [auth]
      summary: Accept the current Terms of Use and Privacy Notice
      description: |
        Records that the signed-in person accepted `version`, with the time.
        Works while acceptance is missing or out of date, like `/api/auth/me`.
        Until the account's accepted version matches `terms_version` from
        `GET /api/site`, every other route except `/api/auth/me`, password change
        and logout answers 403. When the notice changes, the version changes, and
        everyone is asked again at their next visit. Writes an audit row,
        `user.terms_accepted`, with the version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsAcceptance"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Not the current version. Reload and read it again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/password:
    put:
      tags: [auth]
      summary: Change your own password
      description: |
        Changes the password of the signed-in account. An admin changing someone
        else's password uses `POST /api/admin/users/{user_id}/password` instead.

        No audit row is written. Changing your own password crosses no
        privilege boundary.

        Existing session cookies stay valid until they expire. The session is
        signed rather than stored server-side, so there is nothing to revoke.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          description: The current password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/forgot-password:
    post:
      tags: [auth]
      summary: Email a password reset link
      description: |
        Always 202, whether or not the address has an account, so the form
        can't be used to find out who's registered. A link goes out only to a
        confirmed address, since an unconfirmed one might belong to someone
        else. One email per address every two minutes. The link carries the
        token after `#` so it never reaches server logs, and it stops working
        once the password changes.

        Paths under `/api/auth` that are verbs come from the auth library, like
        login and logout. Everything written for this system is a noun.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOnly"
      responses:
        "202":
          description: Accepted.

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password from an emailed link
      description: |
        Same password rules as everywhere else. Clears `must_change_password`,
        since the person chose this one. Existing sessions stay valid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "200":
          description: Password changed.
        "400":
          description: |
            `detail` is `RESET_PASSWORD_BAD_TOKEN` for an expired or used link,
            or an object `{code: RESET_PASSWORD_INVALID_PASSWORD, reason}` when
            the new password breaks the rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/request-verify-token:
    post:
      tags: [auth]
      summary: Email a link to confirm the address
      description: |
        Always 202. Sent automatically at sign-up; this resends it. Same
        two-minute limit per address. The link lasts 24 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOnly"
      responses:
        "202":
          description: Accepted.

  /api/auth/verify:
    post:
      tags: [auth]
      summary: Confirm an email address from the emailed link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenOnly"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: |
            `VERIFY_USER_BAD_TOKEN` or `VERIFY_USER_ALREADY_VERIFIED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------ requests ----
  /api/requests:
    post:
      tags: [requests]
      summary: Submit a request
      description: |
        Persists the request and returns it immediately with status `submitted`
        and a reference number. Classification runs after the response, so the
        citizen never waits on inference; poll the detail endpoint (or watch
        notifications) for the classified result.

        Only authenticated citizens may submit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCreate"
      responses:
        "201":
          description: Accepted and persisted. Not yet classified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [requests]
      summary: List requests, scoped to the caller's role
      description: |
        Scope is applied server-side and cannot be widened by query parameters:

        - **citizen**, only their own requests
        - **staff**, requests assigned to them, plus requests in a category they
          hold an active routing rule for, plus everything in `under_review`. The
          union matters twice: deactivating a rule must not strip a staff member
          of requests already assigned to them, and a request awaiting manual
          classification cannot be scoped by a category that does not exist yet.
        - **admin**, all requests

        The `under_review` clause is a deliberate widening of least privilege.
        Unclassified requests are visible to all staff because the category that
        would otherwise scope them is exactly what is in doubt; every review
        decision is attributed in the audit log.

        Default ordering is role-dependent and chosen by the server, not the
        client. Staff and admin get highest urgency first, then oldest first,
        which is the order the queue is worked in. Citizens get newest first, because
        a resident opening their list is looking for the request they just
        filed, not the most urgent one.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          description: Repeat the parameter to match any of several statuses.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RequestStatus"
        - name: category_id
          in: query
          schema:
            type: integer
        - name: urgency
          in: query
          schema:
            $ref: "#/components/schemas/Urgency"
      responses:
        "200":
          description: |
            A page of requests. Residents: their own, newest first, linked
            reports included. Staff and admins: reports a resident marked urgent
            first, then highest urgency (a request left waiting sorts one level
            higher), then oldest; resolved requests last; linked reports are left
            out because they follow their main report.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RequestSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/requests/{request_id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [requests]
      summary: Request detail
      description: |
        Same role scoping as `GET /api/requests`, including the `under_review`
        clause. Otherwise every row in the review queue would 404 on click.

        Returns 404, not 403, when the request exists but is outside the caller's
        scope. A 403 would confirm the id is real and let a staff member map
        requests outside their categories by probing ids.
      responses:
        "200":
          description: The request, with its status history and attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/requests/{request_id}/status:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    patch:
      tags: [requests]
      summary: Change status
      description: |
        Staff and admin only. Writes a `status_history` row and an audit entry,
        and notifies the citizen. Illegal transitions are rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not a legal transition from the current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/requests/{request_id}/attachments:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [requests]
      summary: Attach a file
      description: |
        The owning citizen, or staff assigned to the request. Anyone else gets
        404, the same as for a request that doesn't exist. MIME type and size
        are validated server-side against the declared allowlist, and the file's
        first bytes must match its declared type. The `accept` attribute on a
        file input is a hint to the user, not a control.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: File exceeds the maximum size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: MIME type not allowed, or the contents don't match it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/requests/{request_id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: attachment_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [requests]
      summary: Download an attachment
      description: |
        Scoped exactly as the parent request, so a file is never reachable by
        anyone who cannot see the request itself. Served through the API rather
        than as a static URL. `stored_path` is deliberately not exposed, so an
        unguessable-URL scheme is not standing in for an access check.
      responses:
        "200":
          description: File contents.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------- review queue ----
  /api/review-queue:
    get:
      tags: [review]
      summary: Requests awaiting manual classification
      description: |
        Staff and admin. Requests whose lower confidence score fell below the
        threshold and which therefore have status `under_review`, plus any request
        still at `submitted` two minutes after it was sent, meaning its
        classification never finished. Oldest first, because this queue is a
        backlog and urgency here is not yet trustworthy.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of requests needing a human label.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RequestSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/requests/{request_id}/duplicate-suggestions:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [requests]
      summary: Possible duplicates of this report
      description: |
        Staff and admins, within their scope. Open, unlinked reports from the
        72 hours before this one, in the same category (and place, when both
        have one), with at least 30% of their distinct words in common, and
        at least as far along as this one, since only those can take it. Staff
        decide; nothing is linked automatically.
      responses:
        "200":
          description: Pending suggestions, closest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicateSuggestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/requests/{request_id}/same-problem:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [requests]
      summary: Other reports that could be linked to this one
      description: |
        Staff and admins, within their scope. For an open main report: open,
        unlinked reports from the 72 hours either side, not further along and
        with no reports of their own linked, whose place matches when both have
        one. Listed when 30% or more of distinct words match (`likely`, ticked
        at the start, whatever category the model gave them), or when in the
        same category, or the same place within the hour (unticked). Pairs
        staff marked as not the same are left out.
      responses:
        "200":
          description: Most alike first. Empty for a linked or finished report.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SameProblemReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/requests/{request_id}/linked-reports:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [requests]
      summary: Link several reports to this one at once
      description: |
        Staff and admins. Each listed report is linked as with
        `PUT /api/requests/{id}/duplicate-of`, in one transaction. A report
        that can't be linked is skipped with the reason instead of failing the
        rest, and one not visible to the caller is skipped as not found. Each
        resident gets one notice, however many of their reports were linked.
        One audit row, `request.linked`, per report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkReports"
      responses:
        "200":
          description: What was linked and what was skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkReportsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/requests/{request_id}/duplicate-suggestions/{suggestion_id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - name: suggestion_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [requests]
      summary: Say a suggestion is not a duplicate
      description: Writes an audit row, `request.duplicate_dismissed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionDecision"
      responses:
        "204":
          description: Dismissed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/requests/{request_id}/duplicate-of:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    put:
      tags: [requests]
      summary: Link this report to the main report about the same problem
      description: |
        Staff and admins. This report takes the main report's labels and
        handler and is brought up to its status through the allowed steps, one
        history row each. It then leaves the queues and follows every later
        status change, with the staff note. One level only. A report still
        being sorted goes to review first, so the classifier leaves it alone.
        Refused when the main report is itself linked, closed or not sorted
        yet, when this report has reports linked to it, or when this report is
        further along than the main one. Writes an audit row, `request.linked`,
        and notifies the resident.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateLink"
      responses:
        "200":
          description: Linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: This report, or the main one, is not found in the caller's scope.
        "409":
          description: The link isn't allowed (see above).
        "422":
          description: Linked to itself.
    delete:
      tags: [requests]
      summary: Undo a link
      description: |
        At any time. The report keeps its labels and status and returns to the
        queues. If the link had carried it to resolved or closed, it goes back
        to For review with no handler and the resident is told. Writes an audit
        row, `request.unlinked`.
      responses:
        "200":
          description: Unlinked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not linked.

  /api/request-surges:
    get:
      tags: [requests]
      summary: Many reports about one problem in the last hour
      description: |
        Staff and admins, within their scope. Five or more unlinked reports in
        one category (and place, when listed) within the last hour, with the
        report to link the others to.
      responses:
        "200":
          description: Current surges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/locations:
    get:
      tags: [locations]
      summary: Places residents can pick for "Where is the problem?"
      description: Switched-on places, in the admin's order. Empty until the admin adds one.
      responses:
        "200":
          description: The places.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/locations:
    get:
      tags: [admin]
      summary: Every place, including switched-off ones
      responses:
        "200":
          description: The places.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Add a purok or street
      description: Writes an audit row, `location.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationCreate"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: That place is already listed.

  /api/admin/locations/{location_id}:
    parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: Rename, reorder or switch a place on or off
      description: Places are never deleted. Writes an audit row, `location.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That place is already listed.

  /api/requests/{request_id}/urgent-flag:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    put:
      tags: [requests]
      summary: Mark own request as urgent
      description: |
        The resident who sent it, once, while it is open. Pins it to the top of
        the staff queue and For review and notifies the assigned staff member.
        Does not change the urgency label. Writes an audit row,
        `request.flagged_urgent`, without the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrgentFlag"
      responses:
        "200":
          description: Marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already marked, or the request is finished.
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/requests/{request_id}/classification:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    patch:
      tags: [review]
      summary: Set the final category and urgency
      description: |
        Staff and admin. Sets `final_category_id` and `final_urgency`, then
        re-runs routing.

        Works on **any** request the caller can see, not only items in the review
        queue, because the case where correction matters most is when the model
        was confident and wrong, and that request never reaches the queue. The
        model's original prediction is never overwritten, so every correction
        stays measurable against it.

        **Re-routing can hand the request to someone else.** Changing the
        category re-runs the routing rules, so a request may be reassigned to a
        different staff member, after which the correcting staff member no
        longer sees it, because it is no longer theirs. That is intended: they
        handed it off. The citizen is notified of the reassignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: |
            Labelled and routed. `assigned_staff` may differ from before the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Request is `resolved` or `closed`. A finished request is not
            relabelled. Re-routing one would resurrect it into an active queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The body failed validation, or `final_category_id` is not a category
            that exists and is switched on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------- categories ----
  /api/categories:
    get:
      tags: [categories]
      summary: List categories
      description: |
        The single source of category values for the whole system. Clients render
        whatever this returns; the taxonomy can change without a frontend release.
      parameters:
        - name: include_inactive
          in: query
          description: Admin only. Retired categories still appear on historical requests.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Categories, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ------------------------------------------------------- notifications ----
  /api/notifications:
    get:
      tags: [notifications]
      summary: List the caller's notifications
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of notifications, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    required: [unread_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Notification"
                      unread_count:
                        type: integer
                        description: Total unread for this user, independent of paging.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications/{notification_id}/read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [notifications]
      summary: Mark as read
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------- registrations ----
  /api/registrations:
    get:
      tags: [registrations]
      summary: List resident sign-ups by approval status
      description: |
        Staff and admins. Citizens only, oldest first, so whoever signed up
        first gets checked first. Defaults to `pending`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, rejected]
            default: pending
      responses:
        "200":
          description: A page of sign-ups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/registrations/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [registrations]
      summary: Approve or turn down a resident sign-up
      description: |
        Staff and admins. Citizens only. A turned-down sign-up can be approved
        later, so a mistake is not permanent. An approved account can't be
        turned down here, since that would let staff lock residents out, which
        is an admin's call through `PATCH /api/admin/users/{user_id}`. Approving
        needs a confirmed email while `REQUIRE_VERIFIED_EMAIL` is on, 409
        otherwise. Approving needs `verification_method`, how staff checked
        that the person lives in the barangay; only that choice is stored, never
        an ID number or a copy of an ID. Writes an audit row, `user.approved`
        (detail: the method) or `user.rejected`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationDecision"
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No citizen account with that id.
        "422":
          description: Approving without a verification method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---------------------------------------------------------------- site ----
  /api/site:
    get:
      tags: [site]
      summary: The barangay's details and the site's look
      description: |
        Public, because the masthead and footer show before anyone signs in.
        Contact fields are null until an admin fills them in, and the client
        hides a null field rather than showing a guess. `terms_version` is the
        Terms of Use and Privacy Notice version that sign-up and
        `POST /api/auth/terms` must send.
      security: []
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /api/site/logo:
    get:
      tags: [site]
      summary: The uploaded logo
      description: |
        Public. 404 when no logo has been uploaded, in which case the client
        shows the default. Clients add `logo_version` as a query parameter so a
        new upload isn't hidden by the browser cache.
      security: []
      responses:
        "200":
          description: The image.
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"

  # --------------------------------------------------------------- admin ----
  /api/admin/users:
    get:
      tags: [admin]
      summary: List accounts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          description: Case-insensitive substring match on email and full name.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [admin]
      summary: Create an account with a role
      description: The only way a staff or admin account comes into existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [admin]
      summary: Update an account
      description: |
        Accounts are deactivated, never deleted. Deleting one would orphan the
        audit trail and the requests it acted on. Set `is_active: false` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/admin/users/{user_id}/password:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [admin]
      summary: Reset an account password
      description: |
        Issues a temporary password and returns it once, in this response. It is
        never stored unhashed and never appears in the audit log, which any admin
        can read. The admin reads it to the account holder, who changes it.

        Writes an audit row with action `user.password_reset` and no detail.
        Sets `must_change_password`. The temporary password can still sign in,
        but that session can only change the password until it's replaced.

        An admin may reset their own account, so there is no 409 here.
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/routing-rules:
    get:
      tags: [admin]
      summary: List routing rules
      responses:
        "200":
          description: All rules, active and inactive.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      tags: [admin]
      summary: Replace the routing table
      description: |
        Replaces the full set in one transaction, because the routing screen edits
        the table as a whole. At most one active rule per category. Routing must
        be deterministic, and two active rules would leave the choice to
        insertion order. Superseded rules are deactivated, not deleted. Every
        category must exist, and every newly assigned handler must be an active
        staff member or admin (422). A rule already in place is kept as is. If
        its handler was later deactivated or demoted, the rule stops routing and
        the category's requests go to the review queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  items:
                    $ref: "#/components/schemas/RoutingRuleInput"
      responses:
        "200":
          description: The rules now in effect.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: More than one active rule for the same category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The body failed validation, a category doesn't exist, or a newly
            assigned handler isn't an active staff member or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/site:
    patch:
      tags: [admin, site]
      summary: Change the barangay's details or the site's colour
      description: |
        Admin only. Send only the fields to change. `null` clears a contact
        field, which then disappears from the site. `theme` is one of the
        preset colours, each already checked for readable contrast, so no
        choice can make text unreadable. Writes an audit row, `site.updated`,
        listing the fields that changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/admin/site/logo:
    put:
      tags: [admin, site]
      summary: Upload a new logo
      description: |
        Admin only. PNG, JPEG or WebP, at most 1 MB. Replaces any earlier
        upload. Writes an audit row, `site.logo_changed`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Larger than 1 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not a PNG, JPEG or WebP image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin, site]
      summary: Go back to the default logo
      description: Admin only. Writes an audit row, `site.logo_removed`.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/categories:
    get:
      tags: [admin, categories]
      summary: Every category, including those switched off
      description: Admin only. `GET /api/categories` lists only the ones switched on.
      responses:
        "200":
          description: All categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [admin, categories]
      summary: Rename, describe, or switch a category on or off
      description: |
        Admin only. The `slug` never changes, because it is the label the
        classifier was trained on. There is no create or delete: the classifier
        can only predict the categories it was trained on, so a new one could
        never be chosen automatically. A request the classifier puts in a
        switched-off category goes to the review queue instead of being routed,
        and staff can't pick a switched-off category when relabelling. At least
        one category must stay on. Writes an audit row, `category.updated`,
        listing the fields that changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This would switch off the last category that is on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/admin/audit-log:
    get:
      tags: [admin]
      summary: Read the audit log
      description: Append-only. There is no endpoint that edits or deletes an entry.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
            maxLength: 100
        - name: object_type
          in: query
          schema:
            type: string
            maxLength: 50
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of entries, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditLogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/requests/{request_id}/referral:
    parameters: [{ $ref: "#/components/parameters/RequestId" }]
    put:
      tags: [requests]
      summary: Refer a concern to another agency
      description: |
        Staff and admins. For a request that isn't started yet (submitted,
        under review or routed) and isn't linked. Clears the handler, tells the
        resident whom to contact, writes `request.referred`. No data is sent to
        the agency.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReferralCreate" } } } }
      responses:
        "200": { description: Referred., content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not referrable in its current state, or linked. }
        "422": { description: Unknown or switched-off agency. }
    delete:
      tags: [requests]
      summary: Take a referral back
      description: Re-runs routing. Writes `request.referral_removed`.
      responses:
        "200": { description: Taken back., content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not referred. }

  /api/agencies:
    get:
      tags: [agencies]
      summary: Active agencies (staff and admin)
      description: Returns a list of all active referral agencies ordered by sort sequence.
      responses:
        "200":
          description: A list of active agencies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agency"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/agencies:
    get:
      tags: [admin]
      summary: Every agency, including switched-off ones
      description: Administrator access only. Returns all registered agencies regardless of active state.
      responses:
        "200":
          description: A complete list of all agencies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agency"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Add an agency (audit agency.created)
      description: Administrator access only. Adds a new referral agency to the platform database tracking system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyCreate"
      responses:
        "201":
          description: Agency created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict. An agency with this exact name already exists.
        "422":
          description: Validation error. Name field is missing, empty, or un-parsable.

  /api/admin/agencies/{agency_id}:
    parameters:
      - name: agency_id
        in: path
        required: true
        description: The numeric database identification integer of the targeted agency.
        schema:
          type: integer
    patch:
      tags: [admin]
      summary: Edit contact details or switch off (audit agency.updated)
      description: Administrator access only. Updates targeted agency parameters or updates its global activation state flags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyUpdate"
      responses:
        "200":
          description: Agency parameters modified successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict. The modification creates a duplicate unique constraint entry name.
        "422":
          description: Validation error. Provided parameter formats are invalid.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gabai_session
      description: |
        HttpOnly session cookie set by `POST /api/auth/login`. Browsers attach it
        automatically; send credentialed requests (`credentials: "include"` on
        cross-origin fetches).

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: No session, or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Authenticated, but not allowed. The role does not permit this action,
        the account is still waiting for approval, it is on a temporary
        password and has to change it first, or it hasn't accepted the current
        Terms of Use and Privacy Notice.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No such resource, or it exists outside the caller's scope. The two are
        deliberately indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with existing state, e.g. the email is taken.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: The body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ------------------------------------------------------ envelope ------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier. Safe to branch on.
              examples: [not_found, forbidden, validation_error, invalid_transition]
            message:
              type: string
              description: Human-readable, safe to show a barangay staff member.
            details:
              type: array
              description: Per-field problems, present on validation errors.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    examples: [description]
                  message:
                    type: string
                    examples: ["Field is required."]

    PaginatedResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          description: Total matching rows, ignoring limit and offset.
        limit:
          type: integer
        offset:
          type: integer

    EmailOnly:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    TokenOnly:
      type: object
      required: [token]
      properties:
        token:
          type: string

    PasswordReset:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    RegistrationDecision:
      type: object
      required: [approval_status]
      properties:
        approval_status:
          type: string
          enum: [approved, rejected]
        verification_method:
          $ref: "#/components/schemas/VerificationMethod"
          description: Required when approving, ignored when turning down.

    VerificationMethod:
      type: string
      enum: [id_in_person, personally_known, barangay_record]
      description: |
        How staff confirmed a resident lives in the barangay: a valid ID shown
        in person, someone staff know personally, or the barangay's own records.

    # --------------------------------------------------------- enums ------
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
      description: Staff and admin accounts are always `approved`.

    Role:
      type: string
      enum: [citizen, staff, admin]

    Urgency:
      type: string
      enum: [low, medium, high]
      description: A learned model output, not derived from keywords or rules.

    RequestStatus:
      type: string
      enum:
        - submitted
        - classified
        - routed
        - under_review
        - in_progress
        - resolved
        - closed
        - referred
      description: |
        `submitted` on creation. Then `routed` when both confidence scores clear
        the threshold (and a low urgency clears the stricter 0.85), or
        `under_review` otherwise. `classified` is defined but not used. From
        `routed`: `in_progress` → `resolved` → `closed`.

    # --------------------------------------------------------- users ------
    User:
      type: object
      required: [id, email, full_name, role, is_active, is_verified, approval_status, must_change_password, terms_accepted_version, terms_accepted_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            UUID rather than a sequential integer. This is the only table holding
            personal data and its ids appear in URLs and audit records, so an
            authorization slip must not degrade into enumerating every resident.
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 150
        role:
          $ref: "#/components/schemas/Role"
        is_active:
          type: boolean
        is_verified:
          type: boolean
          description: The person clicked the link emailed to this address.
        approval_status:
          $ref: "#/components/schemas/ApprovalStatus"
        residence:
          type: [string, "null"]
          description: |
            Purok or street, as the resident typed it at sign-up. Only there so
            staff can confirm the person lives in the barangay. Null for staff
            and admin accounts.
        verification_method:
          oneOf:
            - $ref: "#/components/schemas/VerificationMethod"
            - type: "null"
          description: |
            How staff checked this resident when approving. Null for staff and
            admin accounts, residents not yet approved, residents created by an
            administrator or the seed (nobody checked them through Sign-ups), and
            residents approved before this was recorded.
        must_change_password:
          type: boolean
          description: |
            Set when an admin creates the account or resets its password, cleared
            when the person sets their own. Enforced server-side.
        terms_accepted_version:
          type: [string, "null"]
          description: |
            The Terms of Use and Privacy Notice version this person last accepted.
            Null for accounts made before acceptance was recorded. When it differs
            from `terms_version` in `GET /api/site`, the client asks them to accept.
        terms_accepted_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    UserSummary:
      type: object
      description: Identity only. Used where a full user record would leak PII.
      required: [id, full_name, role]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    RegisterRequest:
      type: object
      required: [email, password, full_name, residence, terms_version]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        residence:
          type: string
          minLength: 1
          maxLength: 150
          description: Purok or street, so staff can confirm residency.
        terms_version:
          type: string
          maxLength: 20
          description: The Terms of Use and Privacy Notice version the person accepted.

    TermsAcceptance:
      type: object
      required: [version]
      properties:
        version:
          type: string
          maxLength: 20

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          format: email
          description: The account email. Named `username` by the auth library.
        password:
          type: string
          format: password

    UserCreate:
      description: Admin-created accounts are approved from the start.
      type: object
      required: [email, password, full_name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        role:
          $ref: "#/components/schemas/Role"

    UserUpdate:
      type: object
      description: Only the supplied fields change. A name is trimmed, and a change of name is recorded in the audit log as `user.renamed`, without the names.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        role:
          $ref: "#/components/schemas/Role"
        is_active:
          type: boolean

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    TemporaryPassword:
      type: object
      description: |
        Returned once and never again. The plaintext exists only in this response
        body; the stored value is hashed like any other password.
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          description: |
            Ten characters from an alphabet with `0`, `O`, `1`, `l` and `I`
            removed, because someone reads this aloud at a shared desk.

    # ---------------------------------------------------- categories ------
    Category:
      type: object
      required: [id, slug, name, description, is_active]
      properties:
        id:
          type: integer
        slug:
          type: string
          description: |
            Stable machine identifier, and the exact label string used in the
            training dataset. Changing it desynchronises the model from the
            database.
          examples: [road_infrastructure]
        name:
          type: string
          description: Display label.
        description:
          type: [string, "null"]
          description: What belongs in this category. Shown as help text.
        is_active:
          type: boolean

    CategoryUpdate:
      type: object
      description: Send only the fields to change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500
        is_active:
          type: boolean

    ThemePreset:
      type: string
      description: |
        A preset main colour. Each has at least 5:1 contrast with white, since
        the colour is used both behind white text and as text.
      enum: [green, blue, maroon, teal, purple, brown]

    SiteSettings:
      type: object
      required: [barangay_name, place, address, hotline, office_hours, theme, logo_version, terms_version, updated_at]
      properties:
        barangay_name:
          type: string
          examples: ["Barangay V (Singko)"]
        place:
          type: string
          examples: ["Amaya, Tanza, Cavite"]
        address:
          type: [string, "null"]
        hotline:
          type: [string, "null"]
        office_hours:
          type: [string, "null"]
        theme:
          $ref: "#/components/schemas/ThemePreset"
        logo_version:
          type: [string, "null"]
          description: Changes with every upload. Null means no upload, so use the default logo.
        terms_version:
          type: string
          description: The current Terms of Use and Privacy Notice version.
        updated_at:
          type: string
          format: date-time

    SiteSettingsUpdate:
      type: object
      description: Send only the fields to change. `null` clears a contact field.
      properties:
        barangay_name:
          type: string
          minLength: 1
          maxLength: 100
        place:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: [string, "null"]
          maxLength: 200
        hotline:
          type: [string, "null"]
          maxLength: 50
        office_hours:
          type: [string, "null"]
          maxLength: 100
        theme:
          $ref: "#/components/schemas/ThemePreset"

    # ------------------------------------------------------ requests ------
    RequestCreate:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 10
          maxLength: 5000
          description: Free text in Filipino, English, or a mix.
        location_id:
          type: [integer, "null"]
          description: |
            Where the problem is, from `GET /api/locations`. Optional: the form
            asks once places are listed, with "Not on the list", which sends
            null. 422 if the place is switched off.

    Location:
      type: object
      required: [id, name, is_active, sort_order]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 80
          description: A purok or street.
        is_active:
          type: boolean
        sort_order:
          type: integer

    LocationCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        sort_order:
          type: integer
          default: 0

    LocationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        is_active:
          type: boolean
        sort_order:
          type: integer

    RequestRef:
      type: object
      required: [id, reference_number]
      properties:
        id:
          type: integer
        reference_number:
          type: string

    DuplicateLink:
      type: object
      required: [reference_number]
      properties:
        reference_number:
          type: string
          maxLength: 20
          description: The main report this one follows.

    SuggestionDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [dismissed]

    DuplicateSuggestion:
      type: object
      required: [id, score, candidate]
      properties:
        id:
          type: integer
        score:
          type: number
          format: float
          description: Share of distinct words the two reports have in common.
        candidate:
          type: object
          required: [id, reference_number, description, status, created_at]
          properties:
            id:
              type: integer
            reference_number:
              type: string
            description:
              type: string
            status:
              $ref: "#/components/schemas/RequestStatus"
            created_at:
              type: string
              format: date-time

    SameProblemReport:
      type: object
      required: [id, reference_number, description, status, created_at, score, likely]
      properties:
        id:
          type: integer
        reference_number:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        created_at:
          type: string
          format: date-time
        score:
          type: number
          format: float
          description: Share of distinct words in common with the main report.
        likely:
          type: boolean
          description: Score of 0.3 or more, any category. Ticked at the start on the screen.

    LinkReports:
      type: object
      required: [request_ids]
      properties:
        request_ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer
        not_same:
          type: array
          maxItems: 200
          items:
            type: integer
          description: |
            Reports listed as likely but unticked. Recorded as not the same
            problem, with an audit row `request.duplicate_dismissed` each, so
            they aren't listed against this report again.

    LinkReportsResult:
      type: object
      required: [linked, skipped]
      properties:
        linked:
          type: array
          items:
            $ref: "#/components/schemas/RequestRef"
        skipped:
          type: array
          items:
            type: object
            required: [id, reference_number, reason]
            properties:
              id:
                type: integer
              reference_number:
                type: string
              reason:
                type: string

    Surge:
      type: object
      required: [category, location, count, since, main]
      properties:
        category:
          $ref: "#/components/schemas/Category"
        location:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        count:
          type: integer
        since:
          type: string
          format: date-time
        main:
          description: The report to open and link the others to, the one furthest along and then the oldest. Null while all are still being sorted.
          oneOf:
            - $ref: "#/components/schemas/RequestRef"
            - type: "null"

    RequestSummary:
      type: object
      description: List rows. Enough for the staff queue without loading history.
      required:
        - id
        - reference_number
        - description
        - category
        - urgency
        - category_confidence
        - urgency_confidence
        - status
        - assigned_staff
        - created_at
        - urgent_flagged_at
        - urgent_pinned
        - waiting_since
        - aged
        - location
        - duplicate_of
        - linked_count
        - referred_agency
      properties:
        id:
          type: integer
        reference_number:
          type: string
          examples: [GAB-2026-00042]
        description:
          type: string
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
          description: Effective category. The human label if set, otherwise the prediction.
        urgency:
          oneOf:
            - $ref: "#/components/schemas/Urgency"
            - type: "null"
          description: Effective urgency, same rule as `category`.
        category_confidence:
          type: [number, "null"]
          format: float
          minimum: 0
          maximum: 1
        urgency_confidence:
          type: [number, "null"]
          format: float
          minimum: 0
          maximum: 1
          description: |
            Carried on list rows so the staff queue can show confidence without a
            detail fetch per row. Surfacing the score makes the classifier legible
            to the operator rather than opaque.
        status:
          $ref: "#/components/schemas/RequestStatus"
        assigned_staff:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        created_at:
          type: string
          format: date-time
        urgent_flagged_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the resident marked it urgent. Set once. Never changes the
            urgency label.
        urgent_pinned:
          type: boolean
          description: |
            Marked urgent, still open, and no staff action since: sorted to the
            top of the staff queue and For review. A status change or relabel
            ends it. A linked report marked urgent pins its main report again.
        waiting_since:
          type: string
          format: date-time
          description: The last status change, or when it was submitted.
        aged:
          type: boolean
          description: |
            Waiting long enough to sort one urgency level higher: low untouched
            48 hours sorts with medium, medium untouched 24 hours with high. The
            stored urgency does not change.
        location:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        duplicate_of:
          oneOf:
            - $ref: "#/components/schemas/RequestRef"
            - type: "null"
          description: The main report this one follows, once staff link it.
        linked_count:
          type: integer
          description: How many other reports follow this one.
        referred_agency:
          oneOf:
            - $ref: "#/components/schemas/Agency"
            - type: "null"
          description: The external entity handling the concern if status is 'referred'.

    Request:
      type: object
      description: |
        Nullable fields are always present in the response, carrying `null` when
        unset. They are listed as required so a client cannot confuse "absent"
        with "not yet classified".
      required:
        - id
        - reference_number
        - citizen
        - description
        - predicted_category
        - predicted_urgency
        - category_confidence
        - urgency_confidence
        - final_category
        - final_urgency
        - category
        - urgency
        - status
        - assigned_staff
        - model_version
        - classified_at
        - created_at
        - updated_at
        - resolved_at
        - urgent_flagged_at
        - urgent_pinned
        - urgent_reason
        - waiting_since
        - aged
        - location
        - duplicate_of
        - linked_reports
        - linked_count
        - attachments
        - status_history
        - referred_agency
        - referred_at
        - referral_note
      properties:
        id:
          type: integer
        reference_number:
          type: string
          description: |
            Human-readable handle a resident can quote in person or by phone.
            Drawn from a database sequence, so gaps after a rolled-back
            transaction are expected and not a defect.
          examples: [GAB-2026-00042]
        citizen:
          $ref: "#/components/schemas/UserSummary"
        description:
          type: string
        predicted_category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
          description: Null until classification runs.
        predicted_urgency:
          oneOf:
            - $ref: "#/components/schemas/Urgency"
            - type: "null"
        category_confidence:
          type: [number, "null"]
          format: float
          minimum: 0
          maximum: 1
        urgency_confidence:
          type: [number, "null"]
          format: float
          minimum: 0
          maximum: 1
          description: |
            Scored independently of the category head. A request is auto-routed
            only if `min(category_confidence, urgency_confidence)` meets the
            threshold, one gate over both labels, so a request is never routed
            on a label the model was unsure of.
        final_category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
          description: |
            Stays null unless a human sets it. Null therefore means "no human has
            labelled this", which is distinct from "a human agreed with the
            model". Collapsing the two would erase the correction record.
        final_urgency:
          oneOf:
            - $ref: "#/components/schemas/Urgency"
            - type: "null"
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
          description: Effective value. `final_category` if set, otherwise `predicted_category`.
        urgency:
          oneOf:
            - $ref: "#/components/schemas/Urgency"
            - type: "null"
          description: Effective value, same rule as `category`.
        status:
          $ref: "#/components/schemas/RequestStatus"
        assigned_staff:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        model_version:
          type: [string, "null"]
          description: |
            Identifier of the exported model that produced the prediction, matching
            the run name recorded during training. Without it, predictions made
            before and after a retrain are indistinguishable.
        classified_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        urgent_flagged_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the resident marked it urgent. Set once. Never changes the
            urgency label.
        urgent_pinned:
          type: boolean
          description: |
            Marked urgent, still open, and no staff action since: sorted to the
            top of the staff queue and For review. A status change or relabel
            ends it. A linked report marked urgent pins its main report again.
        waiting_since:
          type: string
          format: date-time
          description: The last status change, or when it was submitted.
        aged:
          type: boolean
          description: |
            Waiting long enough to sort one urgency level higher: low untouched
            48 hours sorts with medium, medium untouched 24 hours with high. The
            stored urgency does not change.
        location:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        duplicate_of:
          oneOf:
            - $ref: "#/components/schemas/RequestRef"
            - type: "null"
          description: The main report this one follows, once staff link it.
        linked_count:
          type: integer
          description: How many other reports follow this one.
        linked_reports:
          type: array
          description: The reports that follow this one, oldest first.
          items:
            $ref: "#/components/schemas/RequestRef"
        urgent_reason:
          type: [string, "null"]
          maxLength: 200
          description: The resident's reason for marking it urgent. Stored encrypted.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        status_history:
          type: array
          description: Oldest first. Drives the citizen-facing status timeline.
          items:
            $ref: "#/components/schemas/StatusHistoryEntry"
        referred_agency:
          oneOf:
            - $ref: "#/components/schemas/Agency"
            - type: "null"
          description: The external entity handling the concern if status is 'referred'.
        referred_at:
          type: [string, "null"]
          format: date-time
          description: Timestamp recording when the referral action was executed.
        referral_note:
          type: [string, "null"]
          maxLength: 500
          description: Optional contextual note left by staff for the resident.

    StatusUpdate:
      type: object
      required: [to_status]
      properties:
        to_status:
          type: string
          enum: [in_progress, resolved, closed]
          description: |
            Deliberately narrower than `RequestStatus`. The earlier statuses are
            set by the system during classification and routing, so a staff UI
            should not be able to offer them. The illegal option is unrepresentable
            in the client rather than rejected by the server at runtime.
        note:
          type: string
          maxLength: 2000
          description: Resolution note or reason. Shown to the citizen.

    StatusHistoryEntry:
      type: object
      required: [id, from_status, to_status, actor, note, created_at]
      properties:
        id:
          type: integer
        from_status:
          oneOf:
            - $ref: "#/components/schemas/RequestStatus"
            - type: "null"
          description: Null on the first entry, which has no predecessor.
        to_status:
          $ref: "#/components/schemas/RequestStatus"
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
          description: Null when the system made the transition, e.g. auto-routing.
        note:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    UrgentFlag:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Not blank once spaces are trimmed.

    ReviewDecision:
      type: object
      required: [final_category_id, final_urgency]
      properties:
        final_category_id:
          type: integer
        final_urgency:
          $ref: "#/components/schemas/Urgency"
        note:
          type: string
          maxLength: 2000

    Attachment:
      type: object
      required: [id, filename, mime_type, size_bytes, uploaded_at]
      properties:
        id:
          type: integer
        filename:
          type: string
          description: Original name, sanitised. Never used as the storage path.
        mime_type:
          type: string
        size_bytes:
          type: integer
        uploaded_at:
          type: string
          format: date-time

    # --------------------------------------------- routing and audit ------
    RoutingRule:
      type: object
      required: [id, category, staff, is_active]
      properties:
        id:
          type: integer
        category:
          $ref: "#/components/schemas/Category"
        staff:
          $ref: "#/components/schemas/UserSummary"
        is_active:
          type: boolean

    RoutingRuleInput:
      type: object
      required: [category_id, staff_id]
      properties:
        category_id:
          type: integer
        staff_id:
          type: string
          format: uuid

    AuditLogEntry:
      type: object
      required: [id, actor, action, object_type, object_id, detail, ip_address, created_at]
      properties:
        id:
          type: integer
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
          description: Null when the system acted, e.g. auto-classification or auto-routing.
        action:
          type: string
          examples: [request.status_changed, user.deactivated, routing_rules.replaced]
        object_type:
          type: string
          examples: [request]
        object_id:
          type: [string, "null"]
        detail:
          type: [object, "null"]
          additionalProperties: true
          description: Action-specific context, e.g. before and after values.
        ip_address:
          type: [string, "null"]
          description: |
            Retained for attributability. Personal data under RA 10173, collected
            because an audit trail that cannot be attributed is not an audit trail.
        created_at:
          type: string
          format: date-time

    # ------------------------------------------------- notifications ------
    Notification:
      type: object
      required: [id, request_id, reference_number, message, is_read, created_at]
      properties:
        id:
          type: integer
        request_id:
          type: [integer, "null"]
          description: Null for notices not tied to a request.
        reference_number:
          type: [string, "null"]
          description: Denormalised so the list renders without an extra fetch.
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    Agency:
      type: object
      required: [id, name, is_active, sort_order]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string, nullable: true }
        hours: { type: string, nullable: true }
        website: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        sort_order: { type: integer }

    AgencyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sort_order: { type: integer, default: 0 }

    AgencyUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        hours: { type: string, nullable: true }
        website: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        sort_order: { type: integer }

    ReferralCreate:
      type: object
      required: [agency_id]
      properties:
        agency_id: { type: integer }
        note: { type: string, nullable: true }
